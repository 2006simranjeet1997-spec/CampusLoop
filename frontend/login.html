
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CampusLoop</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Campus<span>Loop</span></a>
        <a href="signup.html" class="nav-link">Create Account</a>
    </nav>

    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-icon">💜</div>
            <p class="eyebrow">WELCOME BACK</p>
            <h1>Login to <span>CampusLoop</span></h1>
            <p class="subtitle">Your campus marketplace is waiting for you.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">College email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" data-target="password">Show</button>
                    </div>
                </div>

                <button type="submit" class="primary-button">Login →</button>
                <p id="formMessage" class="form-message" role="status"></p>
            </form>

            <p class="switch-auth">
                Don't have an account? <a href="signup.html">Sign up</a>
            </p>
            <a href="index.html" class="back-home">← Back to homepage</a>
            <p class="demo-note">Frontend demo only. Account authentication will be added with the backend.</p>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
