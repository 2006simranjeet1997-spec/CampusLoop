
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | CampusLoop</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Campus<span>Loop</span></a>
        <a href="login.html" class="nav-link">Login</a>
    </nav>

    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-icon">🎓</div>
            <p class="eyebrow">JOIN YOUR CAMPUS</p>
            <h1>Create your <span>account.</span></h1>
            <p class="subtitle">Find useful items and connect with fellow students.</p>

            <form id="signupForm">
                <div class="form-group">
                    <label for="name">Full name</label>
                    <input type="text" id="name" placeholder="Enter your name" maxlength="80" required>
                </div>

                <div class="form-group">
                    <label for="email">College email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" placeholder="At least 8 characters" minlength="8" required>
                        <button type="button" class="toggle-password" data-target="password">Show</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <div class="password-field">
                        <input type="password" id="confirmPassword" placeholder="Enter password again" minlength="8" required>
                        <button type="button" class="toggle-password" data-target="confirmPassword">Show</button>
                    </div>
                </div>

                <button type="submit" class="primary-button">Create Account →</button>
                <p id="formMessage" class="form-message" role="status"></p>
            </form>

            <p class="switch-auth">
                Already have an account? <a href="login.html">Login</a>
            </p>
            <a href="index.html" class="back-home">← Back to homepage</a>
            <p class="demo-note">Frontend demo only. Your account will not be created until backend authentication is connected.</p>
        </section>
    </main>

    <script src="js/signup.js"></script>
</body>
</html>
